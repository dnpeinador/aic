apiVersion: v1
environment: main
namespace: backend
hpa:
  minReplicas: 1
  maxReplicas: 1
backend:
  image:
    repository: 541141112016.dkr.ecr.us-east-1.amazonaws.com/token-issuer-configuration-services-v2
    tag: "4b05a24d"
    pullPolicy: Always
  historyLimitReplicas: 0
  resources:
    requests:
      cpu: 100m
    limits:
      cpu: 250m
  service:
    name: backend
    data:
      type: Internal
      port: 8080
      protocol: TCP
      target_port: 8080
      name: http
      basepath: /v2/tokenization_services/token_issuer_configuration_services/?(.*)
  configmap:
    PORT: "8080"
    API_PREFIX: TICS
    APP_STAGE: dev
    CONTEXT: v2/tokenization_services/token_issuer_configuration_services
    ORIGINS: http://localhost:3000,http://localhost:8080
    ALLOWED_HEADERS: Content-Type,Authorization,Set-Cookie,Access-Control-Allow-Origin,Cache-Control,Pragma
    ALLOWED_METHODS: GET,HEAD,PUT,POST,DELETE,PATCH,OPTIONS
    PROPAGATE_HEADERS: x-apip-client-id,x-apip-cuit,x-apip-partner-id
    CORS_ENABLED: "true"
    CORS_CREDENTIALS: "false"
    PROXY_API_NAME: token_issuer_configuration_services
    PROXY_API_VERSION: v2
    SWAGGER_PATH: docs
    SWAGGER_ENABLED: "true"
    TRACING_ENDPOINT: http://open-telemetry-collector-collector.otel:4318/v1/traces
    LOG_OBFUSCATE: message.config.url,message.config.params,message.config.headers
    LOG_EXCLUDE_CONTENT_TYPE: application/pdf,application/x-download
    SKIP_HEALTH_CHECKS: observability
    OBSERVABILITY_INDEX_NAME: issuing
    OBSERVABILITY_NODE: https://vpc-api-program-ieptwp3irqagbd6hv6mwosjfqa.us-east-1.es.amazonaws.com
    OBSERVABILITY_DOCUMENT_OBFUSCATE: headers.request['authorization'],headers.request['apiKey']
    ACCESS_VALIDATION_API_URL: https://acc-val-dev.api-homo.prismamediosdepago.com/v2/core/access-validation/validation
    ACCESS_VALIDATION_API_URL_LIVENESS: /v2/core/access-validation/health/liveness
    API_URL: "https://developers-dev.prismamediosdepago.com:8082/v2/core/tokenization_services/token_issuer_configuration_services"
    API_URL_LIVENESS: "/v1/core/atm/echo/message"
  external_secret:
    secret_name: opensearch-dev-dev-secret
    service_account_name: opensearch-sa-dev
