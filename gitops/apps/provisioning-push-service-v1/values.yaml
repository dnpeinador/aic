apiVersion: v1
environment: main
namespace: backend
hpa:
  minReplicas: 1
  maxReplicas: 1
backend:
  image:
    repository: 541141112016.dkr.ecr.us-east-1.amazonaws.com/provisioning-push-service-v1
    tag: "fd035038"
    pullPolicy: Always
  replicaCount: 1
  historyLimitReplicas: 1
  resources:
    requests:
      cpu: 100m
    limits:
      cpu: 250m
  service:
    name: backend
    data:
      type: Internal
      port: 8080
      protocol: TCP
      target_port: 8080
      name: http
      basepath: /v1/provisioning-push/?(.*)
  configmap:
    PORT: "8080"
    API_PREFIX: PPS
    APP_STAGE: dev
    CONTEXT: v1/provisioning-push
    ORIGINS: http://localhost:3000,http://localhost:8080
    ALLOWED_HEADERS: Content-Type,Authorization,Set-Cookie,Access-Control-Allow-Origin,Cache-Control,Pragma
    ALLOWED_METHODS: GET,HEAD,PUT,POST,DELETE,PATCH,OPTIONS
    PROPAGATE_HEADERS: x-apip-client-id,x-apip-cuit,x-apip-partner-id
    CORS_ENABLED: "true"
    CORS_CREDENTIALS: "false"
    PROXY_API_NAME: provisioning-push-service
    PROXY_API_VERSION: v1
    SWAGGER_PATH: docs
    SWAGGER_ENABLED: "true"
    TRACING_ENDPOINT: http://open-telemetry-collector-collector.otel:4318/v1/traces
    LOG_OBFUSCATE: message.config.url,message.config.params,message.config.headers
    LOG_EXCLUDE_CONTENT_TYPE: application/pdf,application/x-download
    OBSERVABILITY_INDEX_NAME: issuing
    OBSERVABILITY_NODE: https://vpc-api-program-ieptwp3irqagbd6hv6mwosjfqa.us-east-1.es.amazonaws.com
    OBSERVABILITY_DOCUMENT_OBFUSCATE: headers.request['authorization'],headers.request['apiKey']
    ACCESS_VALIDATION_API_URL: https://acc-val-dev.api-homo.prismamediosdepago.com/v2/core/access-validation/validation
    ACCESS_VALIDATION_API_URL_LIVENESS: /v2/core/access-validation/health/liveness
    RICK_AND_MORTY_API_URL: https://rickandmortyapi.com/api
    RICK_AND_MORTY_API_URL_LIVENESS: /api/character/1

    API_URL: https://api-core-dev.prismamediosdepago.com/v1/core/d1/bff-public-thales-d1-gateway
    API_URL_LIVENESS: /v1/core/d1/bff-public-thales-d1-gateway/health/liveness

    TEST_KEY: testKeyEnv-test
  external_secret:
    secret_name: opensearch-dev-dev-secret
    service_account_name: opensearch-sa-dev
health:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  readiness:
    failureThreshold: 3
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
