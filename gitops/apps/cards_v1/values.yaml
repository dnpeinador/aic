environment: main
apiVersion: v1
namespace: backend
port: 8080
hpa:
  minReplicas: 1
  maxReplicas: 1
backend:
  image:
    repository: 541141112016.dkr.ecr.us-east-1.amazonaws.com/cards_v1
    tag: "f1a4219d"
    pullPolicy: Always
  historyLimitReplicas: 0
  resources:
    requests:
      cpu: 100m
    limits:
      cpu: 250m
  service:
    name: backend
    data:
      type: Internal
      port: 8080
      protocol: TCP
      target_port: 8080
      name: http
      basepath: "/v1/basic_card_details/?(.*)"
  configmap:
    APP_STAGE: "dev"     
    PORT: "8080"
    API_PREFIX: "cards"
    CONTEXT: "v1/basic_card_details"
    ORIGINS: "http://localhost:3000,http://localhost:8080,https://api-dev.prismamediosdepago.com,https://developers-dev.prismamediosdepago.com"
    ALLOWED_HEADERS: "Content-Type,Authorization,Set-Cookie,Access-Control-Allow-Origin,Cache-Control,Pragma"
    ALLOWED_METHODS: "GET,HEAD,PUT,POST,DELETE,PATCH,OPTIONS"
    RESPONSE_HEADER: "x-apip-client-id,x-apip-cuit,x-apip-partner-id"
    CORS_ENABLED: "true"
    CORS_CREDENTIALS: "false"
    SWAGGER_PATH: "docs"
    SWAGGER_ENABLED: "true"
    SKIP_HEALTH_CHECKS: observability
    JAEGER_ENDPOINT: "http://localhost:14268/api/traces"
    TRACING_ENDPOINT: http://open-telemetry-collector-collector.otel:4318/v1/traces
    LOG_OBFUSCATE: "message.config.url,message.config.params,message.config.headers"
    LOG_EXCLUDE_CONTENT_TYPE: "application/pdf,application/x-download"
    ACCESS_VALIDATION_API_URL_LIVENESS: "/v2/core/access-validation/health/liveness"    
    ACCESS_VALIDATION_API_URL: "http://acc-val-dev-internal.api-homo.prismamediosdepago.com/v2/core/access-validation/validation"
    BASIC_CARD_DETAILS: "https://developers-dev.prismamediosdepago.com:8082/v1/core/cards"
    CARD_API_URL_LIVENESS: "/v1/core/atm/echo/message"
    OBSERVABILITY_INDEX_NAME: issuing-dev
    OBSERVABILITY_NODE: https://vpc-api-program-ieptwp3irqagbd6hv6mwosjfqa.us-east-1.es.amazonaws.com
    OBSERVABILITY_DOCUMENT_OBFUSCATE: headers.request['authorization'],headers.request['apiKey']
    PROXY_API_NAME: cards
    PROXY_API_VERSION: v1
  secrets:
    TEST_KEY: testKeyEnv-test

  external_secret:
    service_account_name: opensearch-sa-dev
    secret_name: opensearch-dev-dev-secret
