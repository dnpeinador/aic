apiVersion: v1
environment: main
namespace: backend
hpa:
  minReplicas: 1
  maxReplicas: 1
backend:
  image:
    repository: 541141112016.dkr.ecr.us-east-1.amazonaws.com/issuer-declined-tx-notification-services-v1
    tag: "8048d638"
    pullPolicy: Always
  historyLimitReplicas: 0
  resources:
    requests:
      cpu: 100m
    limits:
      cpu: 250m
  service:
    name: backend
    data:
      type: Internal
      port: 8080
      protocol: TCP
      target_port: 8080
      name: http
      basepath: /v1/issuer_tx_notifications/declined_transactions/?(.*)
  configmap:
    PORT: "8080"
    APP_STAGE: dev
    API_PREFIX: ISSUER_TX_NOTIFICATIONS/DECLINED_TRANSACTIONS
    CONTEXT: v1/issuer_tx_notifications/declined_transactions
    ORIGINS: http://localhost:3000,http://localhost:8080
    ALLOWED_HEADERS: Content-Type,Authorization,Set-Cookie,Access-Control-Allow-Origin,Cache-Control,Pragma
    ALLOWED_METHODS: GET,HEAD,PUT,POST,DELETE,PATCH,OPTIONS
    PROPAGATE_HEADERS: x-apip-client-id,x-apip-cuit,x-apip-partner-id
    CORS_ENABLED: "true"
    CORS_CREDENTIALS: "false"
    PROXY_API_NAME: issuer_declined_tx_notification_services
    PROXY_API_VERSION: v1
    SWAGGER_PATH: docs
    SWAGGER_ENABLED: "true"
    TRACING_ENDPOINT: http://open-telemetry-collector-collector.otel:4318/v1/traces
    LOG_OBFUSCATE: message.config.url,message.config.params,message.config.headers
    LOG_EXCLUDE_CONTENT_TYPE: application/pdf,application/x-download
    SKIP_HEALTH_CHECKS: observability
    OBSERVABILITY_INDEX_NAME: issuing
    OBSERVABILITY_NODE: https://vpc-api-program-ieptwp3irqagbd6hv6mwosjfqa.us-east-1.es.amazonaws.com
    OBSERVABILITY_DOCUMENT_OBFUSCATE: headers.request['authorization'],headers.request['apiKey']
    ACCESS_VALIDATION_API_URL: http://acc-val-dev-internal.api-homo.prismamediosdepago.com/v2/core/access-validation/validation
    ACCESS_VALIDATION_API_URL_LIVENESS: /v2/core/access-validation/health/liveness
    ISSUER_DECLINED_NOTIFICATION_API_URL: http://api.eps-transactions-notifier.issuing-dev.prismamp.com/v1/ms-consumer-subscription
    ISSUER_DECLINED_NOTIFICATION_API_URL_LIVENESS: /v1/ms-consumer-subscription/health/liveness
    TEST_KEY: testKeyEnv-test
  external_secret:
    secret_name: opensearch-dev-dev-secret
    service_account_name: opensearch-sa-dev
